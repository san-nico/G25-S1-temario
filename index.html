<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Redirecting...</title>

  <script>
    // Redirección más confiable que meta refresh
    window.location.replace("https://san-nico.github.io/G26-S1-temario-react/");
  </script>

  <noscript>
    <!-- Fallback si JS está desactivado -->
    <meta http-equiv="refresh" content="1; url=https://san-nico.github.io/G26-S1-temario-react/" />
  </noscript>
</head>

<body>
  <p>Redirigiendo...</p>
</body>

</html>
